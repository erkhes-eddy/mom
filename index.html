<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Хайрт ээждээ төрсөн өдрийн мэнд хүргэе! ❤️</title>
  <!-- Кирилл Монгол үсгийг бүрэн дэмждэг Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: linear-gradient(135deg, #fff0f5 0%, #fed6e3 50%, #fbc2eb 100%);
      font-family: 'Montserrat', sans-serif;
      color: #4a3e3d;
      overflow-x: hidden;
    }

    /* Floating background elements */
    .bg-hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .heart-particle {
      position: absolute;
      color: rgba(238, 82, 153, 0.35);
      font-size: 22px;
      animation: floatUp 9s infinite linear;
    }
    @keyframes floatUp {
      0% { transform: translateY(105vh) scale(0.8) rotate(0deg); opacity: 0; }
      20% { opacity: 0.8; }
      100% { transform: translateY(-10vh) scale(1.2) rotate(360deg); opacity: 0; }
    }

    /* Main Container */
    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 30px 15px;
      position: relative;
      z-index: 1;
    }

    /* Header Banner */
    header {
      text-align: center;
      padding: 40px 20px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      box-shadow: 0 10px 30px rgba(230, 100, 150, 0.15);
      margin-bottom: 40px;
      border: 2px solid rgba(255, 255, 255, 0.9);
    }
    h1 {
      font-family: 'Caveat', cursive;
      font-size: 3.2rem;
      color: #e84393;
      margin-bottom: 8px;
      line-height: 1.2;
    }
    .date-badge {
      display: inline-block;
      background: rgba(232, 67, 147, 0.1);
      color: #e84393;
      padding: 6px 18px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 1rem;
      margin-top: 5px;
      letter-spacing: 1px;
    }

    /* Cards Layout */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 35px;
    }
    .card {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 8px 25px rgba(232, 67, 147, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.8);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      text-align: center;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(232, 67, 147, 0.25);
    }

    /* Image Wrapper Fix - No Crop */
    .img-wrapper {
      width: 100%;
      height: 380px;
      overflow: hidden;
      border-radius: 18px;
      margin-bottom: 18px;
      background-color: #fff8f9;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #ffeaa7;
    }
    .img-wrapper img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    .img-wrapper img:hover {
      transform: scale(1.02);
    }

    .card .poem-title {
      font-family: 'Caveat', cursive;
      font-size: 2rem;
      color: #e84393;
      margin-bottom: 8px;
      font-weight: bold;
    }
