<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Хайрт Ээждээ Төрсөн Өдрийн Мэнд Хүргэе! ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Great+Vibes&family=Marck+Script&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: linear-gradient(135deg, #fff5f7 0%, #fed6e3 50%, #fbc2eb 100%);
      font-family: 'Comfortaa', cursive, sans-serif;
      color: #4a3e3d;
      overflow-x: hidden;
    }

    /* Floating background hearts */
    .bg-hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .heart-particle {
      position: absolute;
      color: rgba(255, 105, 180, 0.3);
      font-size: 20px;
      animation: floatUp 8s infinite linear;
    }
    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0.8) rotate(0deg); opacity: 0; }
      20% { opacity: 0.8; }
      100% { transform: translateY(-10vh) scale(1.2) rotate(360deg); opacity: 0; }
    }

    /* Main Container */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px 15px;
      position: relative;
      z-index: 1;
    }

    /* Header Banner */
    header {
      text-align: center;
      padding: 40px 20px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      border-radius: 30px;
      box-shadow: 0 10px 30px rgba(230, 100, 150, 0.15);
      margin-bottom: 40px;
      border: 2px solid rgba(255, 255, 255, 0.9);
    }
    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 3.2rem;
      color: #e84393;
      margin-bottom: 10px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
    }
    .subtitle {
      font-size: 1.1rem;
      color: #6c5ce7;
      font-weight: bold;
    }

    /* Timeline Items */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 35px;
    }
    .card {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.6);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      text-align: center;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(232, 67, 147, 0.2);
    }
    .img-wrapper {
      width: 100%;
      max-height: 480px;
      overflow: hidden;
      border-radius: 18px;
      margin-bottom: 15px;
      background-color: #ffeaa7;
      position: relative;
    }
    .img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      cursor: pointer;
      transition: transform 0.4s ease;
    }
    .img-wrapper img:hover {
      transform: scale(1.03);
    }
    .card p {
      font-size: 1rem;
      line-height: 1.6;
